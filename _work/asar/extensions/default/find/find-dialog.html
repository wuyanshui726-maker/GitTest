<div class="find-dialog dialog" data-title="查找">
    <div class="dialog-body">
	    <input type='text' class="k-input k-textbox keyword">
	    <div class="options">
            <label class="k-checkbox">
                <input type="checkbox" class="case-sensitive">
                <div class="k-checkbox__checkmark"></div>
                区分大小写
            </label>
            <label class="k-checkbox">
                <input type="checkbox" class="find-in-documentation">
                <div class="k-checkbox__checkmark"></div>
                在文档中查找
            </label>
	    </div>
    </div>
    <div class="dialog-footer">
        <button class="k-button dialog-button primary" data-button-id="ok">确认</button>
        <button class="k-button dialog-button" data-button-id="cancel">取消</button>
    </div>
</div>
